# ⚠⚠ **kagima on Cloudflare** (`docs/adr/0015`).
#
# ⚠ **`wrangler dev --local` needs no account** — ⚠ **so nothing here costs anything until a
#   ⚠ deploy, ⚠ and a deploy is an owner decision** (`docs/PRODUCT.md` § 6).
#
# ⚠ **Free tier, ⚠ by decision** (`docs/adr/0022`): ⚠ **28.21 room-hours/day is the boundary.**
name = "kagima"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# ⚠⚠ **`account_id` is deliberately absent.**
#
# ⚠ **This repository is public** (`.claude/rules/git.md`: ⚠ **never put the working environment
#   ⚠ into anything public**). ⚠ **An account id is not a credential, ⚠ but it is an identifier of
#   ⚠ somebody's account, ⚠ and it does not become less so for being committed.**
# ⚠ **wrangler reads `CLOUDFLARE_ACCOUNT_ID` from the environment** — ⚠ **so a deploy sets it
#   ⚠ there, ⚠ and nothing lands in git.**
#
# ⚠ **`wrangler dev --local` needs none of this.**

# ⚠⚠ **What the Host hands over** (`docs/adr/0017`).
#
# ⚠ **The share URL is built from this.** ⚠ **A stale one points somewhere the Guest cannot
#   ⚠ reach** — ⚠ **and that was measured once already** (`docs/FIELD-TEST.md`).
# ⚠ **It is the address of a deployed service, ⚠ not a credential** — ⚠ **so it may be written
#   ⚠ here, ⚠ where an account id may not.**
[vars]
PUBLIC_BASE_URL = "https://kagima.hidetzu.workers.dev"

# ⚠⚠ **One room, one object** (`docs/adr/0022`).
#
# ⚠ **Everything a room knows lives here** — ⚠ **the room itself, ⚠ who is at the door, ⚠ who is
#   ⚠ connected.** ⚠ **Splitting them would put state in two places** (`docs/adr/0005`).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# ⚠ **SQLite-backed, ⚠ because that is what a new class gets.**
# ⚠ **What is written is four fields** (`docs/adr/0023`) — ⚠ **never a knock, ⚠ never a token.**
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# ⚠⚠ **The browser's own files** (`docs/adr/0016`).
#
# ⚠ **`public/` is authored; ⚠ `dist/` is built.** ⚠ **The build puts both in `dist/`, ⚠ because
#   ⚠ an Assets binding serves one directory.** ⚠ **Node still reads `public/` directly.**
# ⚠ **`Context.asset` is the seam** — ⚠ **Node reads them off disk, ⚠ this reads them from here.**
[assets]
directory = "./dist"
binding = "ASSETS"
# ⚠⚠ **The Worker answers first, ⚠ always.**
#
# ⚠ **Without this, ⚠ the binding serves the directory before our code runs** — ⚠ **measured
#   ⚠ 2026-09-06: ⚠ `/room.html` redirected to `/room` and was served, ⚠ and neither path is in
#   ⚠ the map.**
# ⚠ **`src/assets.ts` is a closed map on purpose** (`src/static.ts` carried that property before
#   ⚠ the split). ⚠ **Moving platforms must not quietly trade it for a directory walk.**
run_worker_first = true
