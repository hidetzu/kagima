# ⚠ A spike's configuration (`spike/README.md` says what for, ⚠ and that it gets deleted).
# ⚠ **`wrangler dev --local` only.** ⚠ **No account, ⚠ no deploy, ⚠ nothing that costs anything.**
name = "kagima-spike"
main = "worker.ts"
compatibility_date = "2026-09-01"

# ⚠ The room object, ⚠ for measuring how long it keeps what it holds (kagima#47 の続き).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomSpike"
script_name = "kagima-spike"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomSpike"]
