<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kagima</title>
<!--
  ⚠ The referrer is suppressed for this page and everything it opens.
  ⚠ A room URL in a referer header is the room URL handed to somebody who was never told it.
-->
<meta name="referrer" content="no-referrer" />
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 34rem; padding: 1.5rem; }
  h1 { font-size: 1.4rem; }
  .field { margin: 1rem 0; }
  .value { font-family: ui-monospace, monospace; word-break: break-all; background: #f4f4f5;
           padding: .6rem; border-radius: .3rem; }
  button { font: inherit; padding: .5rem .9rem; border-radius: .3rem; border: 1px solid #999;
           background: #fff; cursor: pointer; }
  .hint { color: #555; font-size: .9rem; }
  video { width: 100%; max-width: 16rem; background: #222; border-radius: .3rem; }
</style>

<h1>kagima</h1>

<section id="before">
  <p>合言葉で、ひとときだけ開くプライベート空間をつくります。</p>
  <p class="hint">アカウントは要りません。閉じれば何も残りません。</p>
  <button id="create" type="button">ルームをつくる</button>
</section>

<section id="after" hidden>
  <div class="field">
    <div>共有する URL</div>
    <div class="value" id="share-url"></div>
    <button id="copy-url" type="button">URL をコピー</button>
  </div>

  <!--
    ⚠⚠ **The door** (`docs/adr/0017`).
    ⚠ **One knock at a time.** ⚠ **Never a queue, ⚠ never a count, ⚠ never "満員"** — ⚠ the cap is
      ⚠ abuse protection and is not a product value.
  -->
  <div class="field" id="door" hidden>
    <div id="door-who"></div>
    <button id="admit" type="button">入れる</button>
    <button id="deny" type="button">入れない</button>
    <p class="hint" id="door-more" hidden>ほかにも入室を待っている人がいます。</p>
  </div>

  <p class="hint">
    ⚠ URL を相手に渡してください。<br />
    相手が来たら、この画面でお知らせします。
  </p>

  <p id="status">相手が来るのを待っています。</p>
  <video id="local" autoplay muted playsinline></video>
  <!-- biome-ignore lint/a11y/useMediaCaption: a live stream has no caption track, and making one would mean transcribing the call (docs/adr/0001 forbids it) -->
  <video id="remote" autoplay playsinline></video>
  <p><button id="close" type="button">ルームを閉じる</button></p>
<!--
  ⚠ For the field test (docs/FIELD-TEST.md), not for the product.
  ⚠ Collapsed, because a person on a call does not need it — ⚠ a person recording an
  ⚠ observation does, and they cannot open devtools on a phone.
  ⚠ It shows types and protocols. ⚠ It cannot show an address: see src/diagnostics/report.ts.
-->
<details id="diagnostics">
  <summary>診断(実証実験用)</summary>
  <pre id="diagnostics-text">まだ通話が始まっていません。</pre>
  <button id="diagnostics-copy" type="button">この観測をコピー</button>
  <p class="hint">
    ⚠ IP アドレスは含まれません。⚠ candidate の型とプロトコルだけです。<br />
    ⚠ そのまま Issue に貼れます。
  </p>
</details>

</section>

<script type="module">
  import { classifyMediaError, createCall } from "/client/call.ts";
  import { createDiagnostics } from "/client/diagnostics.ts";
  import { closeRoom, copyOne, createRoom } from "/client/host.ts";
  import { connectSignaling } from "/client/transport.ts";
  import { hostStatus, outranks } from "/status/status.ts";

  const $ = (id) => document.getElementById(id);
  const status = $("status");

  // ⚠ Held here and nowhere else. ⚠ No storage, no URL, no cookie (docs/adr/0005).
  let room = null;
  let call = null;

  $("create").addEventListener("click", async () => {
    $("create").disabled = true;
    try {
      room = await createRoom();
      $("share-url").textContent = room.shareUrl;
      $("before").hidden = true;
      $("after").hidden = false;

      // ⚠ The Host's own way in came with the room (`docs/adr/0017`). ⚠ There is nothing to exchange.
      const token = room.token;
      const transport = await connectSignaling(room.roomId, token);

      // ⚠ Listen BEFORE anything slow. ⚠ `createCall` awaits getUserMedia, and the guest can
      //   ⚠ arrive and say hello while that is still running — ⚠ a handler registered afterwards
      //   ⚠ never sees it, and the host silently never learns who came in.
      //   ⚠ Found by the browser check: frames flowed and the name never appeared.
      // ⚠ Two facts arrive separately and in no fixed order: who came in, and whether media is
      //   ⚠ flowing. ⚠ Writing the same line from two handlers means whichever lands last wins,
      //   ⚠ and the browser check caught exactly that — ⚠ `track` fired after `hello` and erased
      //   ⚠ the name (`.claude/skills/change-review/SKILL.md` § 4: ⚠ the same state written from
      //   ⚠ two places, with nothing deciding which is last).
      // ⚠ So the facts are held, and the line is composed from them.
      // ⚠ ONE writer for this line, and every fact goes through it.
      //
      // ⚠ The first version composed from two facts and still wrote the line directly from a
      //   ⚠ third place. ⚠ CI caught it: a `track` event landing after "the other side left"
      //   ⚠ re-rendered "つながりました。" over it. ⚠ Locally the two never raced.
      // ⚠ `.claude/skills/change-review/SKILL.md` § 4 — ⚠ the same state written from two places,
      //   ⚠ with nothing deciding which is last. ⚠ Twice now, in the same file.
      let guestName = null;
      let connected = false;
      // ⚠ Set once something happened that outranks "who is here": ⚠ it is the last thing known,
      //   ⚠ and a later `track` must not talk over it.
      let ending = null;
      const render = () => {
        // ⚠ textContent, never innerHTML: the name came from outside. ⚠ The other wall is
        //   ⚠ validation, in src/signaling/messages.ts.
        // ⚠ The sentence itself is decided in src/status/status.ts, ⚠ where the fast tier can
        //   ⚠ hold it — ⚠ this file only says where it goes.
        status.textContent = hostStatus({ ending, connected, guestName });
      };



      // ⚠⚠ **Somebody is at the door** (`docs/adr/0017`).
      //
      // ⚠ **One at a time, ⚠ oldest first.** ⚠ **A queue on screen would be a count, ⚠ and a count
      //   ⚠ is a thing the cap must never show.**
      // ⚠ **Nothing about who knocked is kept** — ⚠ **the list lives while the page does.**
      const atTheDoor = [];
      const showDoor = () => {
        const first = atTheDoor[0];
        $("door").hidden = first === undefined;
        $("door-more").hidden = atTheDoor.length <= 1;
        if (first !== undefined) {
          // ⚠ textContent: the name came from outside (same wall as the status line).
          $("door-who").textContent = `${first.nickname} さんがノックしています`;
        }
      };
      const decide = (allow) => {
        const first = atTheDoor.shift();
        if (first === undefined) return;
        transport.send({ type: "admit", knockId: first.knockId, allow });
        showDoor();
      };
      $("admit").addEventListener("click", () => decide(true));
      $("deny").addEventListener("click", () => decide(false));

      transport.onMessage((message) => {
        if (message.type === "knock") {
          atTheDoor.push({ knockId: message.knockId, nickname: message.nickname });
          showDoor();
          return;
        }
        if (message.type === "hello") {
          guestName = message.nickname;
          render();
          return;
        }
        if (message.type !== "peer-left") return;
        // ⚠ The other side dropped. ⚠ Recoverable, and worded as such — ⚠ it is not the room
        //   ⚠ ending, and it is not a fault (CLAUDE.md § 4-1).
        ending = outranks(ending, "peer-left");
        connected = false;
        guestName = null;
        render();
      });

      // ⚠ The guest offers, because the guest arrives second and knows the host is there.
      //   ⚠ The host waiting for an offer IS the waiting state; no extra message is needed.
      // ⚠⚠ **Attached before anything slow, ⚠ like the message handler above.**
      // ⚠ **`createCall` awaits `getUserMedia`; ⚠ a close arriving while the camera prompt is up
      //   ⚠ has nobody listening** (kagima#40 — ⚠ **the guest page had the same shape, ⚠ and a
      //   ⚠ real device found it: ⚠ fake cameras grant instantly and hide it**).
      // ⚠ **The code is remembered too, ⚠ so the diagnostics can be told once it exists.**
      let noteSocketClosed = () => {};
      let closedCode = null;

      // ⚠ The endings are not the same thing (kagima#11).
      //   ⚠ 4005 is the room being over. ⚠ Anything else is this connection going away, which
      //   ⚠ may come back. ⚠ Saying "ended" for the second one would be telling the person
      //   ⚠ something we do not know.
      transport.socket.addEventListener("close", (event) => {
        closedCode ??= event.code;
        noteSocketClosed(event.code);
        if (event.code === 4005) {
          call?.hangUp();
          ending = outranks(ending, "closed");
          render();
          return;
        }
        // ⚠ The call itself may still be running: media goes browser to browser and does not
        //   ⚠ need us (docs/adr/0003). ⚠ So the tracks are NOT stopped here.
        ending = outranks(ending, "detached");
        connected = false;
        render();
      });

      call = await createCall({ transport, isOfferer: false });
      $("local").srcObject = call.localStream;
      $("remote").srcObject = call.remoteStream;
      globalThis.kagimaCall = call;


      // ⚠ The field-test instrument. ⚠ It reads; ⚠ it changes nothing about the call.
      const diagnostics = createDiagnostics(call.pc);
      noteSocketClosed = (code) => diagnostics.noteSocketClosed(code);
      // ⚠ Replayed if it happened while the camera prompt was up. ⚠ The time it carries is when
      //   ⚠ this started looking, ⚠ not when it happened.
      if (closedCode !== null) diagnostics.noteSocketClosed(closedCode);
      const refreshDiagnostics = async () => {
        document.getElementById("diagnostics-text").textContent = await diagnostics.report();
      };
      // ⚠ 250ms, ⚠ because this refresh is also what times the first decoded frame
      //   (src/client/diagnostics.ts). ⚠ A slower refresh would coarsen the measurement.
      setInterval(refreshDiagnostics, 250);
      await refreshDiagnostics();


      document.getElementById("diagnostics-copy").addEventListener("click", async () => {
        await refreshDiagnostics();
        const text = document.getElementById("diagnostics-text").textContent;
        const button = document.getElementById("diagnostics-copy");
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "コピーしました";
        } catch {
          // ⚠ Says what to do instead. ⚠ A button that silently does nothing is worse.
          button.textContent = "コピーできません。上の文字を選んでください";
        }
      });

      // ⚠⚠ **The path could not be built, ⚠ or it broke and did not come back.**
      //
      // ⚠ **`failed` is not `disconnected`.** ⚠ **`disconnected` recovers; ⚠ this does not**
      //   (`CLAUDE.md` § 4). ⚠ **So only `failed` says anything to the person.**
      //
      // ⚠ **kagima#16 decided v0.1.0 ships with STUN only** (`docs/adr/0013`) —
      //   ⚠ **which means some pairs of networks will land here.** ⚠ **Accepting that and not
      //   ⚠ telling the person are two different things:** ⚠ **without this, the screen said
      //   ⚠ "つないでいます。" for ever, ⚠ and somebody waits for something that is not coming**
      //   (`CLAUDE.md` § 4-1: ⚠ never sound stalled, ⚠ never use the progressive for a state).
      //
      // ⚠ **No cause is named.** ⚠ **We cannot see one** — ⚠ **the instrument was stripped of
      //   ⚠ exactly these guesses** (`docs/adr/0012`).
      call.pc.addEventListener("connectionstatechange", () => {
        if (call.pc.connectionState !== "failed") return;
        // ⚠ Two different things, ⚠ and the wrong one is worse than nothing: ⚠ "接続できません
        //   ⚠ でした" after a ten-minute call is a lie about what happened.
        ending = outranks(ending, connected ? "dropped" : "unreachable");
        render();
      });

      // ⚠⚠ **A frame, ⚠ not a negotiation event.**
      //
      // ⚠ **This used to hang off `track`.** ⚠ **`track` fires when the transceiver is created —
      //   ⚠ in the middle of negotiation, ⚠ before any media moves.** ⚠ **So the screen could say
      //   ⚠ "つながりました。" with zero frames decoded** — ⚠ **which is exactly the failure the
      //   ⚠ final gate exists to catch** (`.claude/skills/verify/SKILL.md` § 3).
      // ⚠ **The instrument was fixed for this same reason** (kagima#37). ⚠ **The screen was not.**
      // ⚠ **The screen is the half a person believes.**
      //
      // ⚠ `loadeddata` on the element means a frame is there to show. ⚠ It is what the person
      //   ⚠ actually sees, ⚠ and it is what the browser checks already assert (`videoWidth > 0`).
      $("remote").addEventListener("loadeddata", () => {
        // ⚠ `render` decides, and `ending` outranks this.
        connected = true;
        render();
      });

    } catch (error) {
      console.warn("kagima: the room could not be opened", error);
      const failure = classifyMediaError(error);
      // ⚠ Never opens with what does not work, and never shows the raw error (CLAUDE.md § 4-1).
      status.textContent =
        failure === "denied"
          ? "カメラとマイクの使用を許可すると会話をはじめられます。許可してから、もう一度お試しください。"
          : failure === "no-device"
            ? "カメラまたはマイクが見つかりませんでした。接続してから、もう一度お試しください。"
            : "いまはルームをひらけませんでした。少し待ってから、もう一度お試しください。";
      $("before").hidden = true;
      $("after").hidden = false;
    }
  });

  // ⚠ One control, one thing. ⚠ The URL is the only thing there is to hand over now
  //   (`docs/adr/0017`).
  $("copy-url").addEventListener("click", async () => {
    $("copy-url").textContent = (await copyOne(room.shareUrl))
      ? "URL をコピーしました"
      : "コピーできませんでした。手で選んでください";
  });

  $("close").addEventListener("click", async () => {
    if (room === null) return;
    await closeRoom(room.roomId, room.hostKey);
    call?.hangUp();
    // ⚠ Through the one writer, like everything else on this line.
    ending = outranks(ending, "closed");
    render();
  });
</script>
