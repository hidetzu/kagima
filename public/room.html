<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kagima</title>
<!--
  ⚠ No referrer. ⚠ A room URL in a referer header is the room URL handed to somebody who was
  ⚠ never told it.
-->
<meta name="referrer" content="no-referrer" />
<link rel="stylesheet" href="/style.css" />

<h1>kagima</h1>

<section id="before">
  <p>この部屋に入るには、ホストの許可が要ります。</p>
  <p class="hint">名前を入れて「入室をお願いする」と、ホストの画面にお知らせが出ます。</p>

  <form id="enter">
    <label for="nickname">ニックネーム</label>
    <input id="nickname" name="nickname" autocomplete="off" maxlength="24" required />
    <p class="hint">ホストの画面に出ます。あとには残りません。</p>

    <button type="submit" id="enter-button">入室をお願いする</button>
  </form>
  <p id="error" role="status"></p>
</section>

<!--
  ⚠⚠ **Waiting is shown as what it is** (`docs/adr/0017`).
  ⚠ **Not "審査中" — ⚠ nothing is being judged. ⚠ The Host has not looked yet.**
  ⚠ **Five minutes is accepted**, ⚠ so the wait says so rather than letting somebody guess.
-->
<section id="waiting" hidden>
  <h2>入室をお願いしました</h2>
  <p>ホストが気づくまで、この画面のままお待ちください。</p>
  <p class="hint">数分かかることがあります。</p>
  <p><button type="button" id="give-up">やめる</button></p>
</section>

<section id="after" hidden>
  <p id="status">つないでいます。</p>
  <span class="pic"><video id="local" autoplay muted playsinline></video
    ><span class="dot" id="dot-local" hidden></span></span>
  <!-- biome-ignore lint/a11y/useMediaCaption: a live stream has no caption track, and making one would mean transcribing the call (docs/adr/0001 forbids it) -->
  <span class="pic"><video id="remote" autoplay playsinline></video
    ><span class="dot" id="dot-remote" hidden></span></span>
  <!-- ⚠ 相手がカメラやマイクを切っていることは、⚠ 事実として言う (`CLAUDE.md` § 4-1)。 -->
  <p class="hint" id="peer-state" role="status"></p>

  <!--
    ⚠⚠ **同じものを見る** (`docs/adr/0033`, `docs/PRODUCT.md` § 1)。
    ⚠ 顔とは別の要素である ― ⚠ ひとつにまとめると、片方がもう片方を隠す。
    ⚠ 出せない端末にはボタンを出さない。⚠ user-agent は読まない: ⚠ 機能が在るかで決める。
  -->
  <!-- biome-ignore lint/a11y/useMediaCaption: same reason as above -->
  <span class="pic"><video id="shared" autoplay playsinline hidden></video
    ><span class="dot" id="dot-shared" hidden></span></span>

  <!--
    ⚠⚠ **出している側にも 自分の共有画面を出す** (`docs/adr/0033` 決定 3, Owner 決定 2026-09-09)。
    ⚠ でないと、⚠ 相手の「ここ」が乗る面が こちらに無い。
    ⚠ 画面全体を共有すると 入れ子に映る ― ⚠ 承知の上の代償である。
  -->
  <!-- biome-ignore lint/a11y/useMediaCaption: same reason as above -->
  <span class="pic"><video id="shared-mine" autoplay muted playsinline hidden></video
    ><span class="dot" id="dot-shared-mine" hidden></span></span>

  <!--
    ⚠⚠ **手を離す** (`docs/adr/0033` 決定 4, `docs/PRODUCT.md` § 3)。
    ⚠ カメラを切るのは track を止めること ― ⚠ ランプが消える。⚠ mute は enabled = false。
    ⚠ 文字は「いまどうなっているか」から出す。⚠ ページが最後に押したことからは出さない。
  -->
  <p>
    <button id="microphone" type="button">マイクを切る</button>
    <button id="camera" type="button">カメラを切る</button>
    <button id="share" type="button" hidden>画面を共有する</button>
  </p>
  <p class="hint" id="share-hint"></p>
  <p class="hint" id="camera-hint" role="status"></p>
<!--
  ⚠ For the field test (docs/FIELD-TEST.md), not for the product.
  ⚠ Collapsed, because a person on a call does not need it — ⚠ a person recording an
  ⚠ observation does, and they cannot open devtools on a phone.
  ⚠ It shows types and protocols. ⚠ It cannot show an address: see src/diagnostics/report.ts.
-->
<details id="diagnostics">
  <summary>診断(実証実験用)</summary>
  <pre id="diagnostics-text">まだ通話が始まっていません。</pre>
  <button id="diagnostics-copy" type="button">この観測をコピー</button>
  <p class="hint">
    ⚠ IP アドレスは含まれません。⚠ candidate の型とプロトコルだけです。<br />
    ⚠ そのまま Issue に貼れます。
  </p>
</details>
</section>

<script type="module">
  import { classifyMediaError, createCall } from "/client/call.js";
  import { peerWords } from "/call/notice.js";
  import { wirePointing } from "/client/pointing.js";
  import { canShare, SHARE_UNAVAILABLE } from "/client/share.js";
  import { createDiagnostics } from "/client/diagnostics.js";
  import { forgetHidden, watchDiscards } from "/client/discarded.js";
  import { knock, rejoin, roomIdFromPath, waitForDecision, WORDING } from "/client/guest.js";
  import { forgetRejoin, recallRejoin, rememberRejoin } from "/client/remember.js";
  import { connectReconnecting } from "/client/reconnect.js";
  import { guestStatus, outranks } from "/status/status.js";

  const $ = (id) => document.getElementById(id);
  const roomId = roomIdFromPath(location.pathname);

  /**
   * ⚠⚠ **Everything from "we are in" onwards** (`docs/adr/0029`).
   *
   * ⚠ **It is a function because there are two ways to hold a token now: ⚠ knocking, ⚠ and coming
   * back with a mark this device already had** (kagima#90).
   * ⚠ **Both arrive here with the same thing in hand, ⚠ and nothing below can tell which way it
   * came** — ⚠ **which is what keeps the Host's screen unchanged** (Owner 決定 2026-09-07).
   */
  const enterWith = async (token, nickname) => {
    try {
      // ⚠⚠ **A transport that comes back** (kagima#98, `docs/adr/0029`).
      //
      // ⚠ **Measured 2026-09-06: ⚠ `wrangler deploy` replaced the Durable Object and every open
      //   ⚠ WebSocket closed.** ⚠ **The Host's page already came back** (`src/client/reconnect.ts`);
      //   ⚠ **this one held a single socket and did not.** ⚠ **That asymmetry showed up on every
      //   ⚠ deploy, ⚠ and on every tunnel blip.**
      //
      // ⚠ **The first attempt spends the token the Host's decision just produced.** ⚠ **Every
      //   ⚠ attempt after it mints a fresh one from the mark** — ⚠ **a join token is short-lived,
      //   ⚠ so the one that worked before the socket dropped is the one that will not work now**
      //   (`.claude/rules/security.md` § 4).
      // ⚠⚠ **Without a mark the retries fail and this page ends exactly where it ended before**
      //   — ⚠ **a browser that keeps nothing loses the coming back, ⚠ and nothing else.**
      let unspent = token;
      const transport = await connectReconnecting({
        roomId,
        token: async () => {
          if (unspent !== null) {
            const spending = unspent;
            unspent = null;
            return spending;
          }
          const mark = recallRejoin();
          if (mark === null || mark.roomId !== roomId) {
            throw new Error("this page has no way back into this room");
          }
          const back = await rejoin(roomId, mark.rejoin);
          if (back === null) throw new Error("that room could not be rejoined");
          rememberRejoin({ roomId, rejoin: back.rejoin, nickname: mark.nickname });
          return back.token;
        },
      });

      // ⚠⚠ **Listen BEFORE anything slow. ⚠ The host page already says this; ⚠ this page did not.**
      //
      // ⚠ **`createCall` awaits `getUserMedia`, ⚠ which on a real phone waits for a person to tap
      //   ⚠ "allow" — ⚠ seconds.** ⚠ **A refused join arrives about 5ms after the socket opens**
      //   (⚠ measured: a third peer gets close 4002 at 5ms).
      // ⚠ **So every listener attached after `createCall` misses it, ⚠ and the page carries on as
      //   ⚠ though the socket were alive.**
      // ⚠ **The diagnostics then reported `open throughout`** — ⚠ **which was not "it stayed open"
      //   ⚠ but "we never saw it close".** ⚠ **Found on a real device** (kagima#40); ⚠ **fake
      //   ⚠ cameras grant instantly, ⚠ so no browser check could ever have shown it.**
      let connected = false;
      let ending = null;
      let call = null;
      const render = () => {
        // ⚠ The sentence is decided in src/status/status.ts (`CLAUDE.md` § 3: ⚠ one place).
        $("status").textContent = guestStatus({ ending, connected });
      };
      // ⚠⚠ **Remembered, ⚠ not just forwarded.**
      // ⚠ **Moving the listener earlier was half the fix.** ⚠ **The diagnostics is created after
      //   ⚠ `getUserMedia`, ⚠ so a close that already happened has nobody to tell.**
      // ⚠ **A browser check caught this: ⚠ the wording was right and the record was still empty.**
      let noteSocketClosed = () => {};
      let noteSocketOpen = () => {};
      let closedCode = null;

      // ⚠⚠ **Every drop is recorded, ⚠ including the ones that come back** (kagima#98).
      //   ⚠ **Otherwise the panel would say `open throughout` for a call whose signalling dropped
      //   ⚠ and returned** — ⚠ **the same shape of lie kagima#91 was about.**
      transport.onDrop((code) => {
        closedCode ??= code;
        noteSocketClosed(code);
      });

      // ⚠⚠ **Said again on every socket that comes back** (kagima#98).
      //
      // ⚠ **The Host clears the name when a peer leaves** (`public/index.html`), ⚠ **and a dropped
      //   ⚠ socket is a peer leaving from where it sits.** ⚠ **A page that comes back without
      //   ⚠ saying who it is leaves the Host looking at a call with nobody's name on it** —
      //   ⚠ **which is the thing kagima#90 was fixed not to do.**
      // ⚠ **The first socket is not covered by this**: ⚠ `onOpen` runs for sockets adopted after
      //   ⚠ it is registered, ⚠ and the first one was adopted before that. ⚠ It is said below.
      transport.onOpen(() => {
        // ⚠⚠ **Put on the same clock as everything else** (kagima#98). ⚠ **The panel could say a
        //   ⚠ socket closed and never that one came back.**
        noteSocketOpen();
        transport.send({ type: "hello", nickname });
      });

      // ⚠⚠ **Nothing is said while it is being fixed** (⚠ Owner 決定 2026-09-06, `public/index.html`).
      //   ⚠ **A blip would otherwise put "つながりが切れました" on screen for something that is
      //   ⚠ about to be fine** — ⚠ **and that sentence is about the call, ⚠ which never stopped**
      //   (`CLAUDE.md` § 4-1). ⚠ **One decision, ⚠ applied to both pages.**
      // ⚠⚠ **The close is NOT written down again here** (⚠ measured 2026-09-08).
      //
      // ⚠ **`onGaveUp` is always preceded by the `onDrop` for the same close** — ⚠ **giving up
      //   ⚠ happens either on that close, ⚠ or after retries that began with it**
      //   (`src/client/reconnect.ts`).
      // ⚠⚠ **A real panel showed `984639ms socket -> closed` twice, ⚠ on the same millisecond.**
      //   ⚠ **One socket closing must read as one line** — ⚠ **otherwise a reader cannot tell it
      //   ⚠ from two sockets closing together, ⚠ and the instrument has handed its own confusion
      //   ⚠ to the person reading it** (`.claude/rules/evidence.md`).
      transport.onGaveUp((code) => {
        closedCode ??= code;
        if (code === 4005) {
          // ⚠ The room is over. ⚠ What was written down about this page goes with it
          //   (`src/diagnostics/discards.ts`: ⚠ one room's worth, ⚠ never a pile across rooms).
          forgetHidden();
          // ⚠⚠ **And the way back, ⚠ because there is nothing to come back to**
          //   (`docs/adr/0029`, `docs/adr/0021`: ⚠ **holding a dead mark is how one becomes a pile**).
          forgetRejoin();
          call?.hangUp();
          ending = outranks(ending, "closed");
          render();
          return;
        }
        // ⚠⚠ **A refused join is not a dropped connection.**
        // ⚠ **Rolling 4002 into "detached" told a person who never got in that "the call may still
        //   ⚠ be running" — ⚠ it was not, ⚠ and it never started.** ⚠ **Their next move changes:**
        //   ⚠ **waiting does not help; ⚠ the room is full** (`CLAUDE.md` § 4-1).
        // ⚠ **This is the one refusal whose reason may be named: ⚠ the server said it outright,
        //   ⚠ in the close code.** ⚠ **Nothing is being inferred.**
        // ⚠ Not the room ending — ⚠ this connection went away, and the call may still be running.
        //   ⚠ The tracks stay: media goes browser to browser and does not need us.
        ending = outranks(ending, "detached");
        render();
      });

      transport.onMessage((message) => {
        if (message.type !== "peer-left") return;
        // ⚠ Recoverable, and worded as such. ⚠ "切断されました" would read as a fault.
        ending = outranks(ending, "peer-left");
        connected = false;
        render();
      });

      // ⚠ The guest arrives second and knows the host is there, so the guest offers.
      // ⚠ `canSignal`: ⚠ **a restart offer sent into a closed socket is an attempt spent for
      //   ⚠ nothing** (kagima#89). ⚠ **This page holds one socket, ⚠ so its state is the answer.**
      call = await createCall({
        transport,
        isOfferer: true,
        // ⚠ **This page holds one socket at a time now, ⚠ and can genuinely be between two**
        //   (kagima#98). ⚠ **A restart offer sent into a closed socket is an attempt spent for
        //   ⚠ nothing** (kagima#89).
        canSignal: () => transport.currentSocket()?.readyState === WebSocket.OPEN,
      });
      $("local").srcObject = call.localStream;
      $("remote").srcObject = call.remoteStream;
      globalThis.kagimaCall = call;

      // ⚠⚠ **同じものを見る** (`docs/adr/0033`)。
      //
      // ⚠ **出せる端末だけにボタンを出す。** ⚠ **`getDisplayMedia` が在るかで決め、
      //   ⚠ user-agent は読まない** — ⚠ **端末の名前で機能を推測するのは、⚠ 推測を測定として
      //   ⚠ 扱うことである** (`.claude/rules/evidence.md`)。
      // ⚠ **出せない端末には、⚠ 何ができるかを言う** (`CLAUDE.md` § 4-1)。
      if (canShare(navigator.mediaDevices)) {
        $("share").hidden = false;
        $("share").addEventListener("click", async () => {
          if (call.sharing()) {
            call.stopSharing();
            return;
          }
          try {
            await call.startSharing();
          } catch {
            // ⚠ ブラウザの選択画面で「やめる」を押した。⚠ 失敗ではないので、⚠ 何も言わない。
          }
        });
      } else {
        $("share-hint").textContent = SHARE_UNAVAILABLE;
      }

      // ⚠⚠ **いま自分が何を出しているか** (`docs/adr/0033` 決定 4)。
      //   ⚠ **ボタンの文字は、⚠ ページがしたことではなく ⚠ ここから決める。**
      //   ⚠ **ブラウザ自身の共有バーで止められると、⚠ ページは何も押されていない。**
      let mine = null;
      call.onMyState((state) => {
        mine = state;
        $("microphone").textContent = state.microphone ? "マイクを切る" : "マイクを入れる";
        $("camera").textContent = state.camera ? "カメラを切る" : "カメラを入れる";
        $("share").textContent = state.showing ? "共有をやめる" : "画面を共有する";
        // ⚠ カメラを切ると track は止まる。⚠ 止まった track を映しておくと、⚠ 最後の絵が残る。
        $("local").hidden = !state.camera;
        // ⚠ 自分の共有画面は、⚠ 出しているあいだだけ出す。
        $("shared-mine").hidden = !state.showing;
      });
      $("microphone").addEventListener("click", () => {
        call.setMicrophone(!mine.microphone);
      });
      $("camera").addEventListener("click", async () => {
        $("camera-hint").textContent = "";
        try {
          await call.setCamera(!mine.camera);
        } catch (error) {
          // ⚠ 切ったときに track を手放しているので、⚠ 入れ直すには もう一度もらう必要がある。
          //   ⚠ 断られることがある ― ⚠ できることを言う (`CLAUDE.md` § 4-1)。
          $("camera-hint").textContent =
            classifyMediaError(error) === "denied"
              ? "カメラを許可すると、また映せます。許可してから、もう一度お試しください。"
              : "カメラを使える状態にしてから、もう一度お試しください。";
        }
      });

      // ⚠ 相手が出しているものは、⚠ 顔とは別の要素に出す。⚠ 片方がもう片方を隠さない。
      $("shared").srcObject = call.remoteShareStream;
      $("shared-mine").srcObject = call.myShareStream;
      // ⚠⚠ 「ここ」(`docs/adr/0033` 決定 3)。⚠ 相対座標だけが、⚠ 我々を通らずに 相手へ行く。
      wirePointing(call);
      // ⚠⚠ 出ているかどうかは、⚠ track が有るかではなく ⚠ frames が来ているかで決める。
      //   ⚠ 2 本目は通話が始まった時点で開いており、⚠ 誰も出していない間も track は在る。
      // ⚠ カメラとマイクは 相手が言ったことしか分からない ― ⚠ メディアからは読めない。
      call.onPeerState((state) => {
        $("shared").hidden = !state.showing;
        $("remote").hidden = !state.camera;
        $("peer-state").textContent = peerWords(state);
      });

      // ⚠⚠ The waiting screen comes down here, ⚠ and not before.
      //   ⚠ Leaving it up would show "お待ちください" over a call that has already started.
      $("waiting").hidden = true;
      $("before").hidden = true;
      $("after").hidden = false;

      // ⚠ Relayed, never stored. ⚠ The server passes it through and keeps nothing
      //   (docs/adr/0005); ⚠ when the room ends, the name is gone with it.
      transport.send({ type: "hello", nickname });
      await call.start();




      // ⚠ The field-test instrument. ⚠ It reads; ⚠ it changes nothing about the call.
      // ⚠⚠ **Started once this page is in the room** (kagima#96). ⚠ **A page still at the door
      //   ⚠ has nothing to survive.** ⚠ **Reading first is what counts the page this one was
      //   ⚠ built in place of** (`src/diagnostics/discards.ts`).
      const discards = watchDiscards(roomId);
      const diagnostics = createDiagnostics(call.pc, undefined, discards.facts);
      // ⚠ Handed to the listener that was attached before `getUserMedia`. ⚠ Attaching a second
      //   ⚠ listener here would miss exactly what the first one was moved up to catch.
      noteSocketClosed = (code) => diagnostics.noteSocketClosed(code);
      noteSocketOpen = () => diagnostics.noteSocketOpen();
      // ⚠ Replayed if it happened while the camera prompt was up. ⚠ The time it carries is when
      //   ⚠ this started looking, ⚠ not when it happened — ⚠ which is honest: ⚠ it says the socket
      //   ⚠ was already closed before there was anything to observe with.
      if (closedCode !== null) diagnostics.noteSocketClosed(closedCode);
      const refreshDiagnostics = async () => {
        document.getElementById("diagnostics-text").textContent = await diagnostics.report();
      };
      // ⚠ 250ms, ⚠ because this refresh is also what times the first decoded frame
      //   (src/client/diagnostics.ts). ⚠ A slower refresh would coarsen the measurement.
      setInterval(refreshDiagnostics, 250);
      await refreshDiagnostics();


      document.getElementById("diagnostics-copy").addEventListener("click", async () => {
        await refreshDiagnostics();
        const text = document.getElementById("diagnostics-text").textContent;
        const button = document.getElementById("diagnostics-copy");
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "コピーしました";
        } catch {
          // ⚠ Says what to do instead. ⚠ A button that silently does nothing is worse.
          button.textContent = "コピーできません。上の文字を選んでください";
        }
      });

      // ⚠⚠ **The path could not be built, ⚠ or it broke and did not come back.**
      //
      // ⚠ **`failed` is not `disconnected`.** ⚠ **`disconnected` recovers; ⚠ this does not**
      //   (`CLAUDE.md` § 4). ⚠ **So only `failed` says anything to the person.**
      //
      // ⚠ **kagima#16 decided v0.1.0 ships with STUN only** (`docs/adr/0013`) —
      //   ⚠ **which means some pairs of networks will land here.** ⚠ **Accepting that and not
      //   ⚠ telling the person are two different things:** ⚠ **without this, the screen said
      //   ⚠ "つないでいます。" for ever, ⚠ and somebody waits for something that is not coming**
      //   (`CLAUDE.md` § 4-1: ⚠ never sound stalled, ⚠ never use the progressive for a state).
      //
      // ⚠ **No cause is named.** ⚠ **We cannot see one** — ⚠ **the instrument was stripped of
      //   ⚠ exactly these guesses** (`docs/adr/0012`).
      call.pc.addEventListener("connectionstatechange", () => {
        if (call.pc.connectionState !== "failed") return;
        // ⚠ Two different things, ⚠ and the wrong one is worse than nothing: ⚠ "接続できません
        //   ⚠ でした" after a ten-minute call is a lie about what happened.
        ending = outranks(ending, connected ? "dropped" : "unreachable");
        render();
      });

      // ⚠⚠ **A frame, ⚠ not a negotiation event.**
      //
      // ⚠ **This used to hang off `track`.** ⚠ **`track` fires when the transceiver is created —
      //   ⚠ in the middle of negotiation, ⚠ before any media moves.** ⚠ **So the screen could say
      //   ⚠ "つながりました。" with zero frames decoded** — ⚠ **which is exactly the failure the
      //   ⚠ final gate exists to catch** (`.claude/skills/verify/SKILL.md` § 3).
      // ⚠ **The instrument was fixed for this same reason** (kagima#37). ⚠ **The screen was not.**
      // ⚠ **The screen is the half a person believes.**
      //
      // ⚠ `loadeddata` on the element means a frame is there to show. ⚠ It is what the person
      //   ⚠ actually sees, ⚠ and it is what the browser checks already assert (`videoWidth > 0`).
      $("remote").addEventListener("loadeddata", () => {
        // ⚠ `render` decides, and `ending` outranks this.
        connected = true;
        // ⚠⚠ **扉が開いた** (Owner 決定 2026-09-11)。⚠ **ここから先は 部屋の中である。**
        //   ⚠ **合図は「相手の映像が実際に出た」こと** ― ⚠ **`connectionState` ではない。**
        //   ⚠ **明るさが変わることが、⚠ 入ったことの合図になる** (`public/style.css`)。
        document.body.dataset.where = "room";
        render();
      });

    } catch (error) {
      console.warn("kagima: the call could not start", error);
      const failure = classifyMediaError(error);
      // ⚠ Never the raw error, and never opening with what does not work (CLAUDE.md § 4-1).
      // ⚠⚠ **Back to the screen the person can see.**
      //
      // ⚠ **The waiting screen is showing at this point** — ⚠ **the Host said yes and the camera
      //   ⚠ was asked for straight after.** ⚠ **Writing into a hidden element would leave somebody
      //   ⚠ waiting for ever while the answer sat where nobody could read it.**
      // ⚠ **A browser check caught exactly that.**
      $("waiting").hidden = true;
      $("before").hidden = false;
      $("error").textContent =
        failure === "denied"
          ? "カメラとマイクの使用を許可すると会話をはじめられます。許可してから、もう一度お試しください。"
          : failure === "no-device"
            ? "カメラまたはマイクが見つかりませんでした。接続してから、もう一度お試しください。"
            : "カメラとマイクにつながりませんでした。別のブラウザを試すか、読み込み直してください。";
      $("enter-button").disabled = false;
    }
  };

  $("enter").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("enter-button").disabled = true;
    $("error").textContent = "";

    const nickname = $("nickname").value.trim();

    // ⚠⚠ **Knock. ⚠ Nothing is guessed, ⚠ and nothing secret is sent** (`docs/adr/0017`).
    const knocked = await knock(roomId, nickname);
    if (!knocked.ok) {
      $("error").textContent = WORDING[knocked.why];
      $("enter-button").disabled = false;
      return;
    }

    $("before").hidden = true;
    $("waiting").hidden = false;

    // ⚠⚠ **The camera has NOT been asked for, ⚠ and will not be until the Host says yes**
    //   (`docs/PRODUCT.md` § 3 と § 5)。
    // ⚠ **Somebody who is not let in never hands over a camera.**
    // ⚠⚠ **Waited for, ⚠ not asked for** (`docs/adr/0028`, kagima#78, kagima#99).
    //
    // ⚠ **This used to read `/api/rooms/{roomId}/knock/{knockId}` every two seconds.**
    // ⚠ **The knock id was in that path, ⚠ so it was in logs kagima does not run** (kagima#99),
    //   ⚠ **and the reads were 1,800/hour per waiting person** (kagima#78).
    // ⚠ **Silence still means waiting** — ⚠ **an unknown room, a Host who has not looked and a
    //   ⚠ door with too many people at it all open a socket that says nothing.**
    let stopWaiting = () => {};
    const giveUp = () => {
      stopWaiting();
      $("waiting").hidden = true;
      $("before").hidden = false;
      $("enter-button").disabled = false;
    };
    $("give-up").addEventListener("click", giveUp);

    const token = await new Promise((resolve) => {
      $("give-up").addEventListener("click", () => resolve(null), { once: true });
      stopWaiting = waitForDecision(roomId, knocked.knockId, (ending) => {
        if (ending.state === "admitted") {
          // ⚠⚠ **Kept now, ⚠ before the camera is even asked for** (`docs/adr/0029`).
          //   ⚠ **The browser can throw this page away at any point after here, ⚠ and the whole
          //   ⚠ point is that the Host does not have to decide twice.**
          rememberRejoin({ roomId, rejoin: ending.rejoin, nickname });
          return resolve(ending.token);
        }
        // ⚠ One sentence for refused, closed, and ended while waiting (`docs/adr/0017`).
        giveUp();
        $("error").textContent = WORDING.refused;
        resolve(null);
      });
    });
    if (token === null) return;
    stopWaiting();
    await enterWith(token, nickname);
  });

  /**
   * ⚠⚠ **Come back without knocking, ⚠ if this device holds a mark for THIS room**
   * (`docs/adr/0029`, kagima#90).
   *
   * ⚠ **Measured 2026-09-06: ⚠ a phone's page was thrown away after about six minutes in the
   * background and rebuilt from the document.** ⚠ **The Host had already said yes, ⚠ and had to
   * say it again.**
   *
   * ⚠ **A mark for another room is not used here, ⚠ and not dropped either** — ⚠ **that other
   * room may still be running.**
   * ⚠ **Anything but a token back means: ⚠ knock, ⚠ exactly as this page did before the mark
   * existed.** ⚠ **Nothing is said about why** — ⚠ **refused, expired and "that room is over"
   * are one answer** (`.claude/rules/security.md` § 3).
   */
  const held = roomId === null ? null : recallRejoin();
  if (held !== null && held.roomId === roomId) {
    // ⚠⚠ **The form comes down BEFORE the round trip, ⚠ not after it** (⚠ measured 2026-09-08).
    //
    // ⚠ **Observed on a real phone: ⚠ the page was thrown away while its panel was being pasted,
    //   ⚠ came back on its own, ⚠ and showed "入室をお願いする" on the way** — ⚠ **a form asking
    //   ⚠ this person to ask permission for a room they are already in.**
    // ⚠ **`#waiting` cannot stand in for it: ⚠ "ホストが気づくまでお待ちください" would be false,
    //   ⚠ because nobody is being asked.** ⚠ **`#after` says "つないでいます。", ⚠ which is exactly
    //   ⚠ what is happening** — ⚠ **and it is the same move `public/index.html` makes when the
    //   ⚠ Host comes back to its own room.** ⚠ **No new sentence.**
    $("before").hidden = true;
    $("after").hidden = false;
    const back = await rejoin(roomId, held.rejoin);
    if (back === null) {
      // ⚠ It opens nothing. ⚠ Holding a dead mark is how one becomes a pile (`docs/adr/0021`).
      forgetRejoin();
      // ⚠ And back to the door, ⚠ because now they really do have to knock.
      $("after").hidden = true;
      $("before").hidden = false;
    } else {
      // ⚠ Refreshed on every way in (`docs/adr/0029`).
      rememberRejoin({ roomId, rejoin: back.rejoin, nickname: held.nickname });
      await enterWith(back.token, held.nickname);
    }
  }
</script>
