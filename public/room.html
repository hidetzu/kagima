<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kagima</title>
<!--
  ⚠ No referrer. ⚠ A room URL in a referer header is the room URL handed to somebody who was
  ⚠ never told it.
-->
<meta name="referrer" content="no-referrer" />
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 34rem; padding: 1.5rem; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin: 1rem 0 .3rem; }
  input { font: inherit; padding: .5rem; width: 100%; box-sizing: border-box;
          border: 1px solid #999; border-radius: .3rem; }
  button { font: inherit; padding: .5rem .9rem; border-radius: .3rem; border: 1px solid #999;
           background: #fff; cursor: pointer; margin-top: 1rem; }
  .hint { color: #555; font-size: .9rem; }
  video { width: 100%; max-width: 16rem; background: #222; border-radius: .3rem; }
</style>

<h1>kagima</h1>

<section id="before">
  <p>この部屋に入るには、合言葉が要ります。</p>
  <p class="hint">合言葉は、URL とは別の方法で相手から聞いてください。</p>

  <form id="enter">
    <label for="passphrase">合言葉</label>
    <!-- ⚠ autocomplete off: the passphrase is for this room only and must not be remembered. -->
    <!--
      ⚠⚠ inputmode / autocorrect: ⚠ the words are romaji (`akikaze`, `amagumo`), ⚠ and a phone
        ⚠ sitting in a Japanese IME turns them into kana. ⚠ Normalisation drops everything that is
        ⚠ not a-z, ⚠ so kana does not become a wrong passphrase — ⚠ it becomes an empty one, ⚠ and
        ⚠ the refusal is deliberately indistinguishable from any other (`rules/security.md` § 3).
      ⚠ **So the person is told nothing, and there is nothing to work out.**
      ⚠ These two attributes ask for a Latin keyboard before that happens.
    -->
    <input id="passphrase" name="passphrase" autocomplete="off" autocapitalize="off"
           autocorrect="off" inputmode="latin" spellcheck="false" required />

    <label for="nickname">ニックネーム</label>
    <input id="nickname" name="nickname" autocomplete="off" maxlength="24" required />
    <p class="hint">相手の画面に出ます。あとには残りません。</p>

    <button type="submit" id="enter-button">入る</button>
  </form>
  <p id="error" role="status"></p>
</section>

<section id="after" hidden>
  <p id="status">つないでいます。</p>
  <video id="local" autoplay muted playsinline></video>
  <!-- biome-ignore lint/a11y/useMediaCaption: a live stream has no caption track, and making one would mean transcribing the call (docs/adr/0001 forbids it) -->
  <video id="remote" autoplay playsinline></video>
<!--
  ⚠ For the field test (docs/FIELD-TEST.md), not for the product.
  ⚠ Collapsed, because a person on a call does not need it — ⚠ a person recording an
  ⚠ observation does, and they cannot open devtools on a phone.
  ⚠ It shows types and protocols. ⚠ It cannot show an address: see src/diagnostics/report.ts.
-->
<details id="diagnostics">
  <summary>診断(実証実験用)</summary>
  <pre id="diagnostics-text">まだ通話が始まっていません。</pre>
  <button id="diagnostics-copy" type="button">この観測をコピー</button>
  <p class="hint">
    ⚠ IP アドレスは含まれません。⚠ candidate の型とプロトコルだけです。<br />
    ⚠ そのまま Issue に貼れます。
  </p>
</details>
</section>

<script type="module">
  import { roomIdFromPath, join, WORDING } from "/client/guest.ts";
  import { createCall, classifyMediaError } from "/client/call.ts";
  import { createDiagnostics } from "/client/diagnostics.ts";
  import { guestStatus, outranks } from "/status/status.ts";
  import { normalizePassphrase } from "/passphrase/normalize.ts";
  import { connectSignaling } from "/client/transport.ts";

  const $ = (id) => document.getElementById(id);
  const roomId = roomIdFromPath(location.pathname);

  $("enter").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("enter-button").disabled = true;
    $("error").textContent = "";

    // ⚠ Read once, held in a local, never stored anywhere. ⚠ Not in the URL, not in storage.
    const passphrase = $("passphrase").value;
    const nickname = $("nickname").value.trim();

    // ⚠⚠ **Said here, ⚠ before anything is sent, ⚠ and only about what this person typed.**
    //
    // ⚠ **Grounds: the server's refusal is deliberately the same for a wrong passphrase, an
    //   ⚠ unknown room and a rate limit** (`.claude/rules/security.md` § 3). ⚠ **That is right,
    //   ⚠ and it means the server can never say "you typed kana".**
    // ⚠ **A phone left in a Japanese IME produces exactly that**, ⚠ and normalisation drops it to
    //   ⚠ nothing — ⚠ so the person gets the one flat refusal and no way to work out why.
    //
    // ⚠ **This leaks nothing: ⚠ it tells the person about their own keystrokes, ⚠ which they
    //   ⚠ already know.** ⚠ **Nothing has been sent at this point, ⚠ and nothing is sent if this
    //   ⚠ fires** — ⚠ **which also means a mistyped alphabet never spends the room's rate limit.**
    // ⚠ **The rule is the server's own** (`/passphrase/normalize.ts`), ⚠ **imported, not copied** —
    //   ⚠ a second copy would drift and then lie.
    if (normalizePassphrase(passphrase) === "") {
      $("error").textContent =
        "合言葉は英字で入力します。キーボードを英字に切り替えて、もう一度お試しください。";
      $("passphrase").value = "";
      $("enter-button").disabled = false;
      return;
    }

    const result = await join(roomId, passphrase);

    // ⚠ Cleared whatever happened. ⚠ The passphrase has been exchanged for a token and is never
    //   ⚠ read again (docs/adr/0004) — ⚠ leaving it in the field keeps a secret on the screen,
    //   ⚠ in the form, and in whatever restores that form later.
    // ⚠ The browser check found this: it was cleared on failure and kept on success.
    $("passphrase").value = "";

    if (!result.ok) {
      // ⚠ One sentence for every refusal the server declined to tell apart.
      $("error").textContent = WORDING[result.why];
      $("enter-button").disabled = false;
      return;
    }

    try {
      const transport = await connectSignaling(roomId, result.token);
      // ⚠ The guest arrives second and knows the host is there, so the guest offers.
      const call = await createCall({ transport, isOfferer: true });
      $("local").srcObject = call.localStream;
      $("remote").srcObject = call.remoteStream;
      globalThis.kagimaCall = call;

      $("before").hidden = true;
      $("after").hidden = false;

      // ⚠ Relayed, never stored. ⚠ The server passes it through and keeps nothing
      //   (docs/adr/0005); ⚠ when the room ends, the name is gone with it.
      transport.send({ type: "hello", nickname });
      await call.start();

      // ⚠ ONE writer for this line, and every fact goes through it.
      //   ⚠ Four handlers wrote it directly before, and nothing decided which was last —
      //   ⚠ a `track` landing after "the other side left" would talk over it.
      //   ⚠ CI caught exactly that on the host page; ⚠ this page had the same shape.
      //   ⚠ `.claude/skills/change-review/SKILL.md` § 4.
      let connected = false;
      // ⚠ The endings, and they are not the same thing (kagima#11, kagima#16).
      //   ⚠ Once one has happened it outranks "are we connected" — ⚠ it is the last thing known.
      let ending = null;
      const render = () => {
        // ⚠ The sentence is decided in src/status/status.ts (`CLAUDE.md` § 3: ⚠ one place).
        $("status").textContent = guestStatus({ ending, connected });
      };




      // ⚠ The field-test instrument. ⚠ It reads; ⚠ it changes nothing about the call.
      const diagnostics = createDiagnostics(call.pc);
      transport.socket.addEventListener("close", (e) => diagnostics.noteSocketClosed(e.code));
      const refreshDiagnostics = async () => {
        document.getElementById("diagnostics-text").textContent = await diagnostics.report();
      };
      // ⚠ 250ms, ⚠ because this refresh is also what times the first decoded frame
      //   (src/client/diagnostics.ts). ⚠ A slower refresh would coarsen the measurement.
      setInterval(refreshDiagnostics, 250);
      await refreshDiagnostics();


      document.getElementById("diagnostics-copy").addEventListener("click", async () => {
        await refreshDiagnostics();
        const text = document.getElementById("diagnostics-text").textContent;
        const button = document.getElementById("diagnostics-copy");
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "コピーしました";
        } catch {
          // ⚠ Says what to do instead. ⚠ A button that silently does nothing is worse.
          button.textContent = "コピーできません。上の文字を選んでください";
        }
      });

      // ⚠⚠ **The path could not be built, ⚠ or it broke and did not come back.**
      //
      // ⚠ **`failed` is not `disconnected`.** ⚠ **`disconnected` recovers; ⚠ this does not**
      //   (`CLAUDE.md` § 4). ⚠ **So only `failed` says anything to the person.**
      //
      // ⚠ **kagima#16 decided v0.1.0 ships with STUN only** (`docs/adr/0013`) —
      //   ⚠ **which means some pairs of networks will land here.** ⚠ **Accepting that and not
      //   ⚠ telling the person are two different things:** ⚠ **without this, the screen said
      //   ⚠ "つないでいます。" for ever, ⚠ and somebody waits for something that is not coming**
      //   (`CLAUDE.md` § 4-1: ⚠ never sound stalled, ⚠ never use the progressive for a state).
      //
      // ⚠ **No cause is named.** ⚠ **We cannot see one** — ⚠ **the instrument was stripped of
      //   ⚠ exactly these guesses** (`docs/adr/0012`).
      call.pc.addEventListener("connectionstatechange", () => {
        if (call.pc.connectionState !== "failed") return;
        // ⚠ Two different things, ⚠ and the wrong one is worse than nothing: ⚠ "接続できません
        //   ⚠ でした" after a ten-minute call is a lie about what happened.
        ending = outranks(ending, connected ? "dropped" : "unreachable");
        render();
      });

      call.pc.addEventListener("track", () => {
        connected = true;
        render();
      });

      transport.socket.addEventListener("close", (e) => {
        if (e.code === 4005) {
          call.hangUp();
          ending = outranks(ending, "closed");
          render();
          return;
        }
        // ⚠ Not the room ending — ⚠ this connection went away, and the call may still be running.
        //   ⚠ The tracks stay: media goes browser to browser and does not need us.
        ending = outranks(ending, "detached");
        render();
      });

      transport.onMessage((message) => {
        if (message.type !== "peer-left") return;
        // ⚠ Recoverable, and worded as such. ⚠ "切断されました" would read as a fault.
        ending = outranks(ending, "peer-left");
        connected = false;
        render();
      });
    } catch (error) {
      console.warn("kagima: the call could not start", error);
      const failure = classifyMediaError(error);
      // ⚠ Never the raw error, and never opening with what does not work (CLAUDE.md § 4-1).
      $("error").textContent =
        failure === "denied"
          ? "カメラとマイクの使用を許可すると会話をはじめられます。許可してから、もう一度お試しください。"
          : failure === "no-device"
            ? "カメラまたはマイクが見つかりませんでした。接続してから、もう一度お試しください。"
            : "カメラとマイクにつながりませんでした。別のブラウザを試すか、読み込み直してください。";
      $("enter-button").disabled = false;
    }
  });
</script>
